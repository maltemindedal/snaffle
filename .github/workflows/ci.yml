name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Pinned so that the label's move to a newer image is a deliberate change.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --group dev --extra speedups

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run ty check

      - name: Run tests
        # TEMPORARY diagnostic for a stall seen only on Python 3.14: verbose test
        # names, and every thread's stack if the run is still going after 60 s.
        run: >-
          uv run python -X dev -W error -c
          "import faulthandler, unittest;
          faulthandler.dump_traceback_later(60, exit=True);
          unittest.main(module=None, argv=['unittest', 'discover', '-v', 'tests'])"

      - name: Build distribution
        run: uv build

      - name: Verify the wheel ships the py.typed marker
        run: |
          uv run python - <<'PY'
          import glob, sys, zipfile

          wheel = sorted(glob.glob("dist/*.whl"))[-1]
          names = zipfile.ZipFile(wheel).namelist()
          if "snaffle/py.typed" not in names:
              sys.exit(f"py.typed missing from {wheel}: {names}")
          print(f"{wheel} ships py.typed")
          PY