[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "snaffle"
version = "3.0.0"
description = "A simple HTTP CLI client"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Malte Mindedal" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = ["requests>=2.33.1", "tqdm>=4.66.0", "urllib3>=2.7.0"]

[project.optional-dependencies]
# urllib3 negotiates these content encodings automatically once the codecs are
# installed, so large text/JSON responses arrive materially smaller.
speedups = ["zstandard>=0.23", "brotli>=1.1"]

[project.scripts]
# Points at `run`, not `cli:main`, so the console script gets the same
# KeyboardInterrupt handling as `python -m snaffle`.
snaffle = "snaffle.__main__:run"

[tool.setuptools.packages.find]
where = ["src"]
include = ["snaffle", "snaffle.*"]

[tool.setuptools.package-data]
# PEP 561: ship the marker so downstream type checkers use our annotations.
snaffle = ["py.typed"]

[dependency-groups]
dev = [
    "ruff>=0.11.5,<0.12",
    "ty>=0.0.75",
    "types-requests>=2.33.0,<3",
    # Tests need `override` at runtime; the project floor is 3.10 and
    # `typing.override` arrived in 3.12.
    "typing-extensions>=4.4",
]

[tool.ty.rules]
# Every rule at error level -- the strictest configuration ty offers.
all = "error"

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "PERF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["snaffle"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
