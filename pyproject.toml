[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "snaffle"
version = "3.0.0"
description = "A simple HTTP CLI client"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Malte Mindedal" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = ["requests>=2.33.1", "tqdm>=4.66.0", "urllib3>=2.7.0"]

[project.optional-dependencies]
# urllib3 negotiates these content encodings automatically once the codecs are
# installed, so large text/JSON responses arrive materially smaller.
speedups = ["zstandard>=0.23", "brotli>=1.1"]

[project.scripts]
# Points at `run`, not `cli:main`, so the console script gets the same
# KeyboardInterrupt handling as `python -m snaffle`.
snaffle = "snaffle.__main__:run"

[tool.setuptools.packages.find]
where = ["src"]
include = ["snaffle", "snaffle.*"]

[tool.setuptools.package-data]
# PEP 561: ship the marker so downstream type checkers use our annotations.
snaffle = ["py.typed"]

[dependency-groups]
dev = ["mypy>=1.13,<2", "ruff>=0.11.5,<0.12", "types-requests>=2.33.0,<3"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]
mypy_path = "src"
# Build output duplicates the package; without this, `mypy .` after a build
# fails with "Duplicate module named 'snaffle'".
exclude = ["^build/", "^dist/"]

[[tool.mypy.overrides]]
module = ["tqdm"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "PERF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["snaffle"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
